[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ExEv"
version = "0.5.0"
description = "Research simulator for dynamic evacuation routing and optimization"
requires-python = ">=3.11"

[project.scripts]
exev = "exev.cli:main"
exev-study = "exev.study_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
