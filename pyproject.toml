[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evacsim"
version = "0.1.0"
description = "Research simulator for dynamic evacuation routing and optimization"
requires-python = ">=3.11"

[project.scripts]
evacsim = "evacsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

